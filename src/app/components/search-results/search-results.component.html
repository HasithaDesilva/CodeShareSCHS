<div class="results">
  <h2>Search Results</h2>
  <div class="row">
    <div class="col">
      <table class="table table-info table-striped" *ngFor="let member of members; let i = index">
        <tbody>
          <tr>
            <td class="">First name</td>
            <td>
              {{ member.firstName }}
            </td>
          </tr>
          <tr>
            <td>Last name</td>
            <td>
              {{ member.lastName }}
            </td>
          </tr>
          <tr>
            <td>Date of birth</td>
            <td>
              {{ member.dataOfBirth || "--" }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
