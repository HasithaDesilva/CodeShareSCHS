<div class="submit-form">
  <h2>Member Search</h2>
  <form #contactForm="ngForm" novalidate>
    <div>
      <div>
        <h5>Service Date</h5>
        <div class="form-group">
          <input
            type="date"
            class="form-control"
            id="date"
            [(ngModel)]="member.date"
            name="date"
          />
        </div>
      </div>
      <div>
        <h5>Search Using</h5>
        <div class="form-group">
          <label class="form-label" for="policyNumber">Policy Number *</label>
          <input
            type="text"
            class="form-control"
            id="policyNumber"
            required
            [(ngModel)]="member.policyNumber"
            name="policyNumber"
            pattern="[0-9]*"
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="memberCardNumber"
            >Member Card Number </label
          >
          <input
            class="form-control"
            id="memberCardNumber"
            [(ngModel)]="member.memberCardNumber"
            name="memberCardNumber"
            pattern="[0-9]*"
          />
        </div>
        <div id="errorMsgId" class="alert alert-danger d-none" [ngClass]="[divStyle]" role="alert"> 
          <label class="form-label">{{errorMsg}}</label>
        </div>
      </div>
      <div class="actions">
        <button
          (click)="searchMember()"
          class="btn btn-primary"
          [disabled]="!contactForm.valid"
        >
          Search
        </button>
        <button
          (click)="resetForm()"
          class="btn btn-secondary"
        >
          Reset
        </button>
      </div>
    </div>
  </form>
</div>
